server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jlerTestingHubt?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        hbm2ddl:
          halt_on_error: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: false
app:
  upload-dir: ${UPLOAD_DIR:./uploads/images}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
  jwt-secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-32-bytes-long-123456}
  access-seconds: ${ACCESS_SECONDS:900}
  refresh-seconds: ${REFRESH_SECONDS:604800}
  cookie-secure: ${COOKIE_SECURE:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:admin@jler.local}
  admin-password: ${ADMIN_PASSWORD:123456}
  seed: ${SEED_DATA:true}
  seed-overwrite: ${SEED_OVERWRITE:false}
